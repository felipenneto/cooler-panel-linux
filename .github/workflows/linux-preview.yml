name: Linux preview
on:
  push:
    paths: ['linux/**', 'tools/Package-Linux.py', '.github/workflows/linux-preview.yml']
  pull_request:
    paths: ['linux/**', 'tools/Package-Linux.py', '.github/workflows/linux-preview.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s linux -v
      - run: bash -n linux/install.sh
      - run: python tools/Package-Linux.py
